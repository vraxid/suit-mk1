<title>Spider-Man Suit Mk1</title>
<style>
@font-face { font-family: "Chakra Petch"; font-weight: 600; font-display: swap; src: url(fonts/chakra-petch-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Chakra Petch"; font-weight: 700; font-display: swap; src: url(fonts/chakra-petch-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: swap; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; font-display: swap; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 700; font-display: swap; src: url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }
/* Layout idea: a drafting table. Blueprint grid everywhere, the hologram viewer is the sheet, the parts and log are the margin notes. Single dark theme by choice. */
:root {
  --paper: #061527;      /* blueprint ground */
  --sheet: #0a1f37;      /* raised panels */
  --line: #63d3ff;       /* blueprint ink */
  --dim: #3b6f93;        /* faint ink, grid, borders */
  --text: #d8f1ff;       /* readable text */
  --amber: #ffb547;      /* attention: today, active */
  --good: #5cf2a6;       /* done */
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(rgba(99,211,255,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,211,255,.07) 1px, transparent 1px),
    linear-gradient(rgba(99,211,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,211,255,.035) 1px, transparent 1px);
  background-size: 96px 96px, 96px 96px, 16px 16px, 16px 16px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.5;
}
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.wrap { max-width: 1440px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) calc(clamp(16px, 2.4vw, 32px) + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(clamp(16px, 2.4vw, 32px) + env(safe-area-inset-left)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
main, .detail, .viewer, .parts { min-width: 0; }

/* ---------- title block ---------- */
header.title {
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end;
  border: 1px solid var(--dim); padding: 14px 18px; background: rgba(10,31,55,.75); position: relative;
}
.brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4.6vw, 52px); letter-spacing: .08em; line-height: 1; color: #fff; text-shadow: 0 0 18px rgba(99,211,255,.45); text-wrap: balance; }
.brand .mk { font-family: var(--mono); font-size: 12px; letter-spacing: .32em; color: var(--line); margin-top: 6px; }
.meta { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 22px; text-align: right; font-variant-numeric: tabular-nums; }
.meta .k { font-size: 10px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.meta .v { font-family: var(--display); font-size: 22px; font-weight: 600; color: #fff; }
.ctrls { position: absolute; top: 8px; right: 12px; display: flex; gap: 8px; align-items: center; }
.ctl { background: rgba(6,21,39,.85); border: 1px solid var(--dim); color: var(--line); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; padding: 4px 10px; cursor: pointer; }
.ctl:hover { border-color: var(--line); }
.ctl[aria-pressed="false"] { color: var(--dim); }
.sync { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; color: var(--dim); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); display: inline-block; }
.sync.ok i { background: var(--good); box-shadow: 0 0 8px var(--good); }
.sync.warn i { background: var(--amber); }
.sync.ok { color: var(--good); } .sync.warn { color: var(--amber); }
.banner { border: 1px dashed var(--amber); color: var(--amber); padding: 8px 12px; display: none; }
.banner.show { display: block; }

/* ---------- timeline ---------- */
.timeline { border: 1px solid var(--dim); background: rgba(10,31,55,.6); padding: 12px 18px 22px; }
.tl-head { display: flex; justify-content: space-between; gap: 12px; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; flex-wrap: wrap; }
.tl-head b { color: var(--amber); font-weight: 500; }
.tl-bar { position: relative; display: flex; gap: 3px; height: 44px; }
.tl-seg { position: relative; border: 1px solid var(--dim); padding: 4px 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.tl-seg.pause { border-style: dashed; background: repeating-linear-gradient(135deg, rgba(99,211,255,.05) 0 6px, transparent 6px 12px); }
.tl-seg.now { border-color: var(--amber); background: rgba(255,181,71,.08); }
.tl-seg.past { opacity: .55; }
.tl-seg .n { font-family: var(--display); font-weight: 600; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-seg .d { font-size: 10px; color: var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-today { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--amber); box-shadow: 0 0 10px var(--amber); pointer-events: none; }
.tl-today::after { content: "TODAY"; position: absolute; bottom: -16px; left: 4px; font-size: 9px; letter-spacing: .2em; color: var(--amber); }

/* ---------- main ---------- */
main { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
.sheet { border: 1px solid var(--dim); background: rgba(6,21,39,.55); position: relative; }
.corner::before, .corner::after { content: ""; position: absolute; width: 14px; height: 14px; border-color: var(--line); border-style: solid; pointer-events: none; }
.corner::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.corner::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
.viewer { height: clamp(380px, 62vh, 660px); overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#gl:active { cursor: grabbing; }
.vlabel { position: absolute; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--line); pointer-events: none; text-shadow: 0 0 6px rgba(6,21,39,.9); }
.vlabel.tl { top: 12px; left: 14px; } .vlabel.tr { top: 12px; right: 14px; text-align: right; }
.vlabel.bl { bottom: 12px; left: 14px; max-width: calc(100% - 190px); line-height: 1.7; } .vlabel.br { bottom: 12px; right: 14px; text-align: right; color: var(--dim); }
.vlabel .big { font-family: var(--display); font-size: 22px; letter-spacing: .06em; color: #fff; text-transform: none; display: block; margin-top: 2px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--line); letter-spacing: .3em; font-size: 11px; pointer-events: none; }
.hot { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 4px; cursor: pointer; }
.hot .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--amber); background: rgba(255,181,71,.25); box-shadow: 0 0 10px var(--amber); flex: none; }
.hot .lab { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #fff; background: rgba(6,21,39,.85); border: 1px solid var(--dim); padding: 2px 6px; white-space: nowrap; }
.hot:hover .lab, .hot:focus-visible .lab { border-color: var(--amber); color: var(--amber); }
.hot.left { flex-direction: row-reverse; }

.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
.part {
  text-align: left; border: 1px solid var(--dim); background: rgba(10,31,55,.75); padding: 10px 10px 9px; cursor: pointer; display: grid; gap: 4px; position: relative;
}
.part:hover { border-color: var(--line); }
.part[aria-current="true"] { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.part .code { font-size: 10px; letter-spacing: .18em; color: var(--dim); }
.part .nm { font-family: var(--display); font-weight: 600; font-size: 15px; color: #fff; line-height: 1.15; }
.part .st { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
.meter { height: 3px; background: rgba(99,211,255,.15); position: relative; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--line); }
.st-done { color: var(--good); } .st-prog { color: var(--amber); } .st-none { color: var(--dim); }
.meter.done i { background: var(--good); } .meter.prog i { background: var(--amber); }

/* ---------- detail ---------- */
.detail { padding: 16px 16px 18px; display: grid; gap: 18px; }
.d-head { display: grid; gap: 6px; }
.d-head .code { font-size: 10px; letter-spacing: .22em; color: var(--line); }
.d-head h2 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 700; color: #fff; letter-spacing: .03em; text-wrap: balance; }
.d-head p { margin: 0; color: #a9cbe0; max-width: 62ch; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; border: 1px solid currentColor; padding: 2px 8px; width: fit-content; }
.spec { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 11px; color: var(--line); font-variant-numeric: tabular-nums; border-top: 1px dashed var(--dim); border-bottom: 1px dashed var(--dim); padding: 6px 0; }
.spec span b { color: var(--dim); font-weight: 400; margin-right: 6px; }
section h3 { margin: 0 0 8px; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
section h3 span { color: var(--line); }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.tasks label { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; padding: 6px 6px; cursor: pointer; border-left: 2px solid transparent; }
.tasks label:hover { background: rgba(99,211,255,.06); border-left-color: var(--line); }
.tasks input { appearance: none; width: 16px; height: 16px; margin: 2px 0 0; border: 1px solid var(--line); display: grid; place-items: center; cursor: pointer; }
.tasks input:checked { background: var(--good); border-color: var(--good); }
.tasks input:checked::after { content: ""; width: 8px; height: 4px; border: solid var(--paper); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
.tasks input:checked + span { color: #7fa6bf; text-decoration: line-through; text-decoration-color: rgba(92,242,166,.6); }
.tasks input:disabled { opacity: .4; cursor: not-allowed; }
form.row { display: grid; gap: 8px; }
.fields { display: grid; grid-template-columns: 1fr 74px 74px; gap: 6px; }
.fields.withpart { grid-template-columns: 1fr 120px; }
.fields.withpart + .fields { grid-template-columns: 74px 74px 1fr; }
label.f { display: grid; gap: 3px; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
input[type=text], input[type=number], textarea, select {
  background: rgba(6,21,39,.9); border: 1px solid var(--dim); padding: 7px 9px; width: 100%; min-width: 0; font-size: 12px; text-transform: none; letter-spacing: normal;
}
textarea { resize: vertical; min-height: 58px; }
input:focus, textarea:focus, select:focus { border-color: var(--line); outline: none; }
.btn { background: transparent; border: 1px solid var(--line); color: var(--line); padding: 7px 14px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; justify-self: start; }
.btn:hover { background: rgba(99,211,255,.12); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.jobs { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.job { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; border: 1px solid var(--dim); padding: 8px 10px; background: rgba(10,31,55,.7); }
.job .jn { color: #fff; }
.job .jm { font-size: 10px; color: var(--line); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.job .ja { grid-row: span 2; display: flex; gap: 6px; align-items: center; }
.job .ja button { background: none; border: 1px solid var(--dim); color: var(--text); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 8px; cursor: pointer; }
.job .ja button:hover { border-color: var(--line); color: var(--line); }
.job.printing { border-color: var(--amber); }
.job.done { opacity: .6; }
.job.failed { border-color: #ff6b6b; }
.js-queued { color: var(--line); } .js-printing { color: var(--amber); } .js-done { color: var(--good); } .js-failed { color: #ff6b6b; }
.empty { color: var(--dim); font-size: 12px; padding: 4px 0; }
.log { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 0; max-height: 340px; overflow-y: auto; border-left: 1px solid var(--dim); }
.log li { padding: 6px 0 8px 14px; position: relative; }
.log li::before { content: ""; position: absolute; left: -4px; top: 11px; width: 7px; height: 7px; background: var(--paper); border: 1px solid var(--line); transform: rotate(45deg); }
.log li.task::before { border-color: var(--good); }
.log .when { font-size: 10px; letter-spacing: .1em; color: var(--dim); font-variant-numeric: tabular-nums; }
.log .tag { font-size: 9px; letter-spacing: .14em; color: var(--line); text-transform: uppercase; margin-left: 8px; }
.log .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.log li.task .txt { color: #9fc4d9; }
/* inspector + panel board */
.insp { border: 1px solid var(--dim); background: rgba(10,31,55,.85); padding: 12px 14px; display: grid; gap: 8px; position: relative; }
.insp.live { border-color: var(--amber); box-shadow: 0 0 0 1px rgba(255,181,71,.35), 0 0 24px rgba(255,181,71,.12); }
.insp .ic { font-size: 10px; letter-spacing: .22em; color: var(--line); text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; }
.insp .ic em { font-style: normal; color: var(--amber); }
.insp .in { font-family: var(--display); font-size: 22px; font-weight: 700; color: #fff; line-height: 1.1; }
.insp .row2 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.swatch { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text); border: 1px solid var(--dim); padding: 2px 8px; }
.swatch i { width: 10px; height: 10px; display: inline-block; }
.steps { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.step { border: 1px solid var(--dim); background: rgba(6,21,39,.9); color: var(--text); padding: 8px 10px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.step b { font-weight: 500; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
.step small { font-size: 10px; color: var(--dim); }
.step:hover:not(:disabled) { border-color: var(--line); }
.step.on { border-color: var(--good); background: rgba(92,242,166,.1); }
.step.on b { color: var(--good); }
.step.on.final { border-color: #fff; background: rgba(255,255,255,.08); }
.step.on.final b { color: #fff; }
.step:disabled { opacity: .45; cursor: not-allowed; }
.insp .hint { font-size: 11px; color: #a9cbe0; }
.board { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.board li { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; padding: 5px 6px; border-left: 2px solid transparent; cursor: pointer; }
.board li:hover, .board li.hl { background: rgba(255,181,71,.07); border-left-color: var(--amber); }
.board li.sel { border-left-color: var(--line); background: rgba(99,211,255,.07); }
.board .dot { width: 10px; height: 10px; border: 1px solid var(--line); transform: rotate(45deg); }
.board .dot.painted { background: var(--good); border-color: var(--good); }
.board .dot.sewn { background: linear-gradient(135deg, #c22234 50%, #2756a8 50%); border-color: #fff; }
.board .dot.black { background: #0b0d12; border-color: #fff; }
.board .bn { font-size: 12px; }
.board .bn small { color: var(--dim); margin-left: 6px; font-size: 10px; letter-spacing: .1em; }
.board.regions li { grid-template-columns: 12px 1fr auto; }
.board .rc { font-size: 10px; color: var(--dim); letter-spacing: .04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.board .rc b { color: var(--text); font-weight: 500; }
.board .dot.part { background: linear-gradient(135deg, var(--good) 50%, transparent 50%); border-color: var(--good); }
.mini-pieces { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 3px; }
.mini-pieces li { display: grid; grid-template-columns: 10px 34px 1fr; gap: 8px; align-items: center; font-size: 11px; color: var(--dim); }
.mini-pieces b { color: #fff; font-weight: 600; letter-spacing: .06em; }
.mini-pieces .dot { width: 8px; height: 8px; border: 1px solid var(--line); transform: rotate(45deg); }
.mini-pieces .dot.painted { background: var(--good); border-color: var(--good); }
.mini-pieces .dot.sewn { background: linear-gradient(135deg, #c22234 50%, #2756a8 50%); border-color: #fff; }
.sizing .fields { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sizing .units { display: flex; gap: 6px; }
.sizing .units button[aria-pressed=true] { background: rgba(99,211,255,.16); color: #fff; }
.sz-out { border: 1px solid var(--dim); background: rgba(10,31,55,.7); padding: 10px 12px; margin-top: 10px; display: grid; gap: 6px; }
.sz-out .big { font-family: var(--display); font-size: 30px; color: #fff; line-height: 1; }
.sz-out .big small { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--line); margin-left: 8px; }
.sz-out table { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
.sz-out th, .sz-out td { text-align: right; padding: 3px 4px; border-top: 1px solid rgba(99,211,255,.15); }
.sz-out th:first-child, .sz-out td:first-child { text-align: left; }
.sz-out th { font-weight: 400; color: var(--dim); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; }
.sz-out .tight { color: var(--amber); } .sz-out .ok { color: var(--good); }
.sz-out p { margin: 0; font-size: 11px; color: var(--dim); line-height: 1.5; }
.mini { background: none; border: 1px solid var(--dim); color: var(--dim); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; padding: 3px 6px; cursor: pointer; }
.mini:hover:not(:disabled) { border-color: var(--line); color: var(--line); }
.mini.on { border-color: var(--good); color: var(--good); }
.mini.on.final { border-color: #fff; color: #fff; }
.mini:disabled { opacity: .4; cursor: not-allowed; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; display: inline-block; }
.sep { position: absolute; right: 14px; bottom: 12px; background: rgba(6,21,39,.85); border: 1px solid var(--amber); color: var(--amber); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; padding: 8px 12px; cursor: pointer; z-index: 3; }
.sep:hover { background: rgba(255,181,71,.14); }
.sep[aria-pressed="true"] { background: var(--amber); color: var(--paper); }
.tip { position: absolute; pointer-events: none; z-index: 4; background: rgba(6,21,39,.92); border: 1px solid var(--amber); padding: 6px 9px; font-size: 11px; display: none; transform: translate(14px, -50%); white-space: nowrap; }
.tip b { display: block; font-family: var(--display); font-size: 14px; color: #fff; font-weight: 600; }
.tip span { color: var(--amber); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pulseB { 0%,100% { box-shadow: 0 0 0 1px rgba(255,181,71,.35), 0 0 18px rgba(255,181,71,.10); } 50% { box-shadow: 0 0 0 1px rgba(255,181,71,.6), 0 0 30px rgba(255,181,71,.22); } }
@keyframes pop { from { opacity: 0; transform: translate(8px, -50%) scale(.94); } to { opacity: 1; transform: translate(14px, -50%) scale(1); } }
@keyframes scanIn { from { background-position: 0 -120%; } to { background-position: 0 220%; } }
.insp > * { animation: rise .32s ease both; }
.insp > *:nth-child(2) { animation-delay: .04s; } .insp > *:nth-child(3) { animation-delay: .08s; } .insp > *:nth-child(4) { animation-delay: .12s; } .insp > *:nth-child(5) { animation-delay: .16s; }
.insp.live { animation: pulseB 1.6s ease-in-out infinite; }
.insp::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, transparent 0, rgba(99,211,255,.10) 50%, transparent 100%) no-repeat; background-size: 100% 40%; animation: scanIn 1.1s ease-out 1; }
.tip.pop { animation: pop .18s ease-out; }
.board li { transition: background .2s, border-color .2s; }

/* ---- storage on this device (localStorage), same shape as a small document store ---- */
const LocalDB = (() => {
  const KEY = 'suit-mk1-data-v1', COLS = ['parts', 'panels', 'logs', 'jobs'];
  let data = read(); const subs = [];
  function read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function write() { try { localStorage.setItem(KEY, JSON.stringify(data)); return true; } catch (e) { banner('Could not save on this device. Storage may be full or blocked (private browsing).'); return false; } }
  const snap = (c, q) => {
    let docs = Object.entries(data[c] || {}).map(([id, d]) => ({ id, exists: true, data: () => d, metadata: { fromCache: false, hasPendingWrites: false } }));
    if (q.o) docs.sort((a, b) => { const x = a.data()[q.o], y = b.data()[q.o]; return (x > y ? 1 : x < y ? -1 : 0) * (q.dir === 'desc' ? -1 : 1); });
    if (q.n) docs = docs.slice(0, q.n);
    return { docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false }, docChanges: () => [] };
  };
  const fire = c => subs.filter(s => s.c === c).forEach(s => s.cb(snap(c, s.q)));
  const doc = path => { const [c, id] = path.split('/'); return {
    async set(d) { (data[c] = data[c] || {})[id] = d; write(); fire(c); },
    async update(d) { if (!data[c]?.[id]) throw { code: 'invalid_argument' }; data[c][id] = { ...data[c][id], ...d }; write(); fire(c); },
    async delete() { if (data[c]) delete data[c][id]; write(); fire(c); },
  }; };
  const coll = (c, q = {}) => ({
    orderBy: (f, d) => coll(c, { ...q, o: f, dir: d }), limit: n => coll(c, { ...q, n }),
    onSnapshot(cb) { const s = { c, q, cb }; subs.push(s); setTimeout(() => cb(snap(c, q)), 0); return () => subs.splice(subs.indexOf(s), 1); },
    async add(d) { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7); (data[c] = data[c] || {})[id] = d; write(); fire(c); return doc(c + '/' + id); },
    doc: id => doc(c + '/' + id),
  });
  window.addEventListener('storage', e => { if (e.key === KEY) { data = read(); COLS.forEach(fire); } });   // other tabs
  const stamp = d => d?.updatedAt || d?.at || d?.createdAt || '';
  return {
    collection: c => coll(c), doc,
    dump: () => JSON.parse(JSON.stringify(data)),
    merge(inc) {   // newest copy of each record wins; nothing local is deleted
      let n = 0;
      COLS.forEach(c => Object.entries(inc[c] || {}).forEach(([id, d]) => {
        const cur = data[c]?.[id];
        if (!cur || stamp(d) > stamp(cur)) { (data[c] = data[c] || {})[id] = d; n++; }
      }));
      write(); COLS.forEach(fire); return n;
    },
  };
})();
async function exportProgress() {
  const body = JSON.stringify({ app: 'suit-mk1', version: 1, exportedAt: new Date().toISOString(), data: LocalDB.dump() }, null, 1);
  const name = 'suit-mk1-progress-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([body], name, { type: 'application/json' });
  try { if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: 'Suit Mk1 progress' }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
$('#exp').addEventListener('click', exportProgress);
$('#imp').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;

    const n = LocalDB.merge(j.data);

  } catch (err) { banner('That file could not be imported. Choose a progress file exported from Suit Mk1.'); }
});

async function startSync() {
  const api = LocalDB;
  db = api; state.syncing = true;
  let first = { parts: false, logs: false, jobs: false };
  const timer = setTimeout(() => { if (!first.parts) { setSync('warn', 'Reconnecting'); banner('Saved progress is taking a while to load.'); } }, 10000);
  const settle = (k, snap) => { if (!snap.metadata.fromCache) { first[k] = true; if (first.parts) { clearTimeout(timer); setSync('ok', 'Saved on this device'); } } };
  const onErr = e => { clearTimeout(timer); setSync('warn', 'Offline'); banner('Could not read saved progress. Reload the app.'); };
  db.collection('parts').onSnapshot(snap => {
    const done = {}; snap.docs.forEach(d => { done[d.id] = { ...(d.data().done || {}) }; if (d.id === 'sizing') state.measure = d.data().measure || null; });
    state.done = done; settle('parts', snap); render();
  }, onErr);
  db.collection('panels').onSnapshot(snap => {
    const ps = {}; snap.docs.forEach(d => { ps[d.id] = { ...d.data() }; });
    state.panels = ps; render(); applyAllStates(); migrateLegacy(ps);
  }, onErr);
  db.collection('logs').orderBy('at', 'desc').limit(400).onSnapshot(snap => {
    state.logs = snap.docs.map(d => ({ id: d.id, ...d.data() })); settle('logs', snap); render();
  }, onErr);
  db.collection('jobs').orderBy('createdAt', 'asc').onSnapshot(snap => {
    state.jobs = snap.docs.map(d => ({ id: d.id, ...d.data() })); settle('jobs', snap); render(); updatePrinterAnim();
  }, onErr);
  render();
}

// progress marked on the old 9-region suit is copied onto the pattern pieces it covered, once
let migrated = false;
async function migrateLegacy(ps) {
  if (migrated || !db) return; migrated = true;
  const at = new Date().toISOString(), jobs = [];
  Object.entries(LEGACY).forEach(([old, ids]) => {
    const o = ps[old]; if (!o || !(o.painted || o.sewn)) return;
    ids.forEach(id => { if (!ps[id]) jobs.push(db.doc('panels/' + id).set({ painted: !!o.painted, sewn: !!o.sewn, updatedAt: at, from: old })); });
    jobs.push(db.doc('panels/' + old).delete());
  });
  if (jobs.length) { try { await Promise.all(jobs); } catch (e) { writeFail(e); } }
}

  state.done[partId] = cur; render(); SFX.step(on);
  const label = (byId[partId].tasks.find(t => t[0] === taskId) || [, taskId])[1];
  try {
    await serial('parts/' + partId, () => db.doc('parts/' + partId).set({ done: cur, updatedAt: new Date().toISOString() }));
    await db.collection('logs').add({ part: partId, kind: 'task', text: (on ? 'Done: ' : 'Reopened: ') + label, at: new Date().toISOString() });

}
function regionCounts(r) {

function panelStatus(id) {

async function setStep(id, field, on) {

  const cur = { ...(state.panels[id] || {}) };

  if (field === first && !on) cur[last] = false;
  state.panels[id] = cur; render(); applyAllStates(); SFX.step(on, field === last);
  const label = stepsOf(p).find(x => x[0] === field)[1];
  try {
    await serial('panels/' + id, () => db.doc('panels/' + id).set({ ...cur, updatedAt: new Date().toISOString() }));
    await db.collection('logs').add({ part: p.part, kind: 'task', text: (on ? label + ': ' : 'Undone, ' + label.toLowerCase() + ': ') + p.name, at: new Date().toISOString() });
  } catch (e) { writeFail(e); }

/* ================= derived ================= */
function progress(p) {
  let n = p.tasks.length, d = p.tasks.filter(t => state.done[p.id]?.[t[0]]).length;
  PANELS.filter(x => x.part === p.id).forEach(x => { stepsOf(x).forEach(([f]) => { n++; if (state.panels[x.id]?.[f]) d++; }); });
  return { n, d, pct: n ? d / n : 0, st: !n ? 'queue' : d === 0 ? 'none' : d === n ? 'done' : 'prog' };
}
const ST_LABEL = { none: 'Not started', prog: 'In progress', done: 'Done' };
const day = s => new Date(s + 'T00:00:00');
const fmtDate = s => new Date(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const fmtStamp = s => { const d = new Date(s); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); };

function renderTimeline() {
  const tl = $('#tl'); tl.textContent = '';
  const t0 = day(PHASES[0].s), t1 = day(PHASES.at(-1).e); t1.setDate(t1.getDate() + 1);
  const span = t1 - t0, now = new Date();
  let nowName = now < t0 ? 'Not started' : now >= t1 ? 'Finished' : '';
  PHASES.forEach(ph => {
    const s = day(ph.s), e = day(ph.e); e.setDate(e.getDate() + 1);
    const seg = el('div', 'tl-seg' + (ph.pause ? ' pause' : ''));
    seg.style.flex = String((e - s) / 864e5);

    seg.append(el('div', 'n', ph.n), el('div', 'd', fmtDate(ph.s + 'T12:00') + ' – ' + fmtDate(ph.e + 'T12:00')));
    tl.append(seg);
  });
  if (now >= t0 && now < t1) { const m = el('div', 'tl-today'); m.style.left = ((now - t0) / span * 100) + '%'; tl.append(m); }
  $('#tl-now').textContent = nowName;
  const days = Math.ceil((day(TARGET) - now) / 864e5);
  $('#m-days').textContent = days > 0 ? days + 'd' : 'Done';
}

      musicOn = v; if (!quiet) keep('mk1-music', v ? 'on' : 'off'); init(); if (!musicEl || !musicBus) return;
      if (v && soundOn) { if (musicEl.currentTime < MUSIC_START) musicEl.currentTime = MUSIC_START; musicEl.play().catch(() => {}); musicBus.gain.cancelScheduledValues(ctx.currentTime); musicBus.gain.setTargetAtTime(MUSIC_VOL, ctx.currentTime, .8); }
      else { musicBus.gain.setTargetAtTime(0, ctx.currentTime, .3); setTimeout(() => { if (!musicOn || !soundOn) musicEl.pause(); }, 1500); }
    },
  };
})();
// sound controls in the header
(function () {
  const sb = $('#snd'), mb = $('#mus');
  const paint = () => { sb.textContent = 'Sound ' + (SFX.soundOn ? 'on' : 'off'); sb.setAttribute('aria-pressed', SFX.soundOn ? 'true' : 'false'); mb.textContent = 'Music ' + (SFX.musicOn ? 'on' : 'off'); mb.setAttribute('aria-pressed', SFX.musicOn ? 'true' : 'false'); };
  sb.addEventListener('click', () => { SFX.setSound(!SFX.soundOn); paint(); if (SFX.soundOn) SFX.step(true); });
  mb.addEventListener('click', () => { SFX.setMusic(!SFX.musicOn); paint(); });
  SFX.prepareMusic('audio/music.mp3');
  document.addEventListener('musicready', () => { mb.hidden = !SFX.musicAvailable; paint(); });
  paint();
  document.addEventListener('pointerover', e => { if (e.pointerType === 'mouse' && e.target.closest?.('.part, .btn, .mini, .step, .sep, .hot, .board li, .fsb, .ctl')) SFX.uiHover(); });
})();

/* ================= startup sequence: synced to the first 12 s of the theme ================= */
const INTRO = (() => {
  const root = $('#intro'), cv = $('#ic'), gate = $('#gate'), skip = $('#skip'), hud = $('#ihud'), bar = $('#ibar i'), pct = $('#ipct');
  const api = { active: true };
  const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true }); R.setPixelRatio(Math.min(devicePixelRatio, 2));
  const S = new THREE.Scene(), C = new THREE.PerspectiveCamera(32, 1, .1, 1000); C.position.set(0, 4, 84);
  const G = new THREE.Group(); S.add(G);
  function size() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); C.aspect = w / h; C.position.z = 84 * Math.max(1, .9 / Math.min(C.aspect, 1)); C.updateProjectionMatrix(); }
  addEventListener('resize', size); size();
  // reveal shader for the emblem: fills in from a moving line with a scanning edge
  const logoMat = new THREE.ShaderMaterial({
    uniforms: { uReveal: { value: 0 }, uGlow: { value: 0 }, uTime: { value: 0 }, uAlpha: { value: 1 } },
    vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vP; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = -mv.xyz; vP = position; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform float uReveal; uniform float uGlow; uniform float uTime; uniform float uAlpha; varying vec3 vN; varying vec3 vV; varying vec3 vP;
      void main(){
        float h = (vP.y + 13.0) / 26.0 + sin(vP.x * .9 + uTime) * .015;
        if (h > uReveal) discard;
        float edge = 1.0 - smoothstep(0.0, .05, uReveal - h);
        float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 1.6);
        float band = .5 + .5 * sin(vP.y * 2.2 - uTime * 3.0);
        vec3 c = vec3(.39, .83, 1.0) * (.35 + f * 1.1 + band * .15) + vec3(1.0, .82, .55) * edge * 1.4 + vec3(1.0) * uGlow;
        gl_FragColor = vec4(c, uAlpha * (.28 + f * .7 + edge * .8 + uGlow * .5));
      }`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  });
  let logo = null, outline = null, dots = null, dotMat = null, ready = false;
  const rings = [], waves = [];
  function ring(r, w, op, segs = 128, theta = Math.PI * 2) {
    const m = new THREE.Mesh(new THREE.RingGeometry(r, r + w, segs, 1, 0, theta), new THREE.MeshBasicMaterial({ color: 0x63d3ff, transparent: true, opacity: op, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
    G.add(m); return m;
  }
  rings.push({ m: ring(19, .12, .5), spin: .15 }, { m: ring(21, .5, .25, 128, Math.PI * 1.4), spin: -.3 }, { m: ring(23.5, .08, .35), spin: .05 }, { m: ring(16.5, .3, .3, 96, Math.PI * .6), spin: .6 });
  const charge = ring(25.5, .35, 0, 160, .001); charge.material.color.set(0xffb547);
  for (let i = 0; i < 3; i++) { const w = ring(10, .3, 0); w.userData.t = -9; waves.push(w); }
  // tick marks on the outer ring
  const tg = []; for (let i = 0; i < 120; i++) { const a = i / 120 * Math.PI * 2, l = i % 10 ? .6 : 1.6; tg.push(Math.cos(a) * 26.5, Math.sin(a) * 26.5, 0, Math.cos(a) * (26.5 + l), Math.sin(a) * (26.5 + l), 0); }
  const tgeo = new THREE.BufferGeometry(); tgeo.setAttribute('position', new THREE.Float32BufferAttribute(tg, 3));
  const ticks = new THREE.LineSegments(tgeo, new THREE.LineBasicMaterial({ color: 0x63d3ff, transparent: true, opacity: 0 })); G.add(ticks);
  // drifting background dust
  const bgN = 700, bgP = new Float32Array(bgN * 3); for (let i = 0; i < bgN; i++) { bgP[i * 3] = (Math.random() - .5) * 160; bgP[i * 3 + 1] = (Math.random() - .5) * 110; bgP[i * 3 + 2] = (Math.random() - .5) * 80 - 20; }
  const bgG = new THREE.BufferGeometry(); bgG.setAttribute('position', new THREE.BufferAttribute(bgP, 3));
  const bg = new THREE.Points(bgG, new THREE.PointsMaterial({ color: 0x63d3ff, size: .35, transparent: true, opacity: .0, depthWrite: false, blending: THREE.AdditiveBlending })); S.add(bg);
  loader.load('models/logo.glb', gltf => {
    let geo = null; gltf.scene.traverse(o => { if (o.isMesh) geo = o.geometry; });
    if (!geo.attributes.normal) geo.computeVertexNormals();
    logo = new THREE.Mesh(geo, logoMat); G.add(logo);
    outline = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 40), new THREE.LineBasicMaterial({ color: 0xbfefff, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending })); G.add(outline);
    // particles that fly in and settle onto the emblem's surface
    const pos = geo.attributes.position, idx = geo.index, N = 2600, from = new Float32Array(N * 3), to = new Float32Array(N * 3), rnd = new Float32Array(N);
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    for (let i = 0; i < N; i++) {
      const tri = Math.floor(Math.random() * idx.count / 3) * 3;
      a.fromBufferAttribute(pos, idx.getX(tri)); b.fromBufferAttribute(pos, idx.getX(tri + 1)); c.fromBufferAttribute(pos, idx.getX(tri + 2));
      let u = Math.random(), v = Math.random(); if (u + v > 1) { u = 1 - u; v = 1 - v; }
      const p = a.clone().addScaledVector(b.clone().sub(a), u).addScaledVector(c.clone().sub(a), v);
      to.set([p.x, p.y, p.z], i * 3);
      const dir = new THREE.Vector3().randomDirection().multiplyScalar(45 + Math.random() * 45);
      from.set([dir.x, dir.y, dir.z - 10], i * 3); rnd[i] = Math.random();
    }
    const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(from, 3)); dg.setAttribute('aTo', new THREE.BufferAttribute(to, 3)); dg.setAttribute('aR', new THREE.BufferAttribute(rnd, 1));
    dotMat = new THREE.ShaderMaterial({
      uniforms: { uP: { value: 0 }, uT: { value: 0 }, uA: { value: 0 }, uPx: { value: R.getPixelRatio() } },
      vertexShader: `attribute vec3 aTo; attribute float aR; uniform float uP; uniform float uT; uniform float uPx; varying float vR;
        void main(){ float k = clamp((uP - aR * .35) / .65, 0.0, 1.0); k = k * k * (3.0 - 2.0 * k);
          vec3 p = mix(position, aTo, k); p += vec3(sin(uT * 2.0 + aR * 30.0), cos(uT * 1.7 + aR * 20.0), 0.0) * (1.0 - k) * 1.5;
          vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_PointSize = (1.6 + aR * 2.2) * uPx * (60.0 / -mv.z); vR = aR; gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform float uA; varying float vR; void main(){ float d = length(gl_PointCoord - .5); if (d > .5) discard; gl_FragColor = vec4(mix(vec3(.39,.83,1.0), vec3(1.0,.85,.6), step(.93, vR)), uA * (1.0 - d * 2.0)); }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    dots = new THREE.Points(dg, dotMat); G.add(dots);
    ready = true;
  }, undefined, () => { ready = true; });
  // HUD lines: time they appear, text (text can be a function for live values)
  const LINES = [
    [.6, 'SUIT MK1 // BOOT SEQUENCE'], [1.05, 'CORE POWER ........ ONLINE'], [2.0, 'PARTICLE LATTICE .. ASSEMBLING'],
    [4.05, 'EMBLEM L-01 ....... LOCKED'], [5.0, () => 'SUIT MODEL ........ ' + Math.round(loadFrac() * 100) + '%'],
    [6.2, 'PANELS ............ 9 + 2 LOGOS'], [7.2, 'HOLOGRAM .......... STABLE'], [8.6, 'STANDING BY'], [11.4, 'WELCOME BACK, RAFIK'],
  ];
  const lineEls = LINES.map(([, t]) => { const d = el('div', 'iline'); hud.append(d); return d; });
  const title = $('#ititle');
  let t0 = 0, running = false, done = false, revealAt = 12, usingAudio = false;
  const sm = (a, b, x) => { const k = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
  const hit = (x, at, k = 4) => x >= at ? Math.exp(-(x - at) * k) : 0;
  function now() {
    const m = SFX.music;
    if (usingAudio && m && !m.paused && m.currentTime > 0) return m.currentTime;
    return (performance.now() - t0) / 1000;
  }
  function frame() {
    if (done) return;
    const t = running ? now() : 0, T = performance.now() / 1000;
    if (ready && logo) {
      dotMat.uniforms.uP.value = sm(1.0, 4.0, t); dotMat.uniforms.uT.value = T;
      dotMat.uniforms.uA.value = running ? (sm(.2, 1.0, t) * (1 - sm(4.3, 6.5, t) * .75) * (1 - sm(11.8, 12.3, t))) : .25;
      logoMat.uniforms.uReveal.value = sm(4.0, 5.4, t) * 1.08; logoMat.uniforms.uTime.value = T;
      logoMat.uniforms.uGlow.value = hit(t, 4.0, 3) * .9 + sm(11.0, 12.0, t) * .8;
      logoMat.uniforms.uAlpha.value = 1 - sm(8.0, 9.0, t) * .35 + sm(10.6, 11.9, t) * .35;
      outline.material.opacity = sm(1.6, 4.0, t) * (.65 - sm(8, 9, t) * .3 + hit(t, 4.0) * .35);
      // slow turn, settling face-on in the silence before the music
      G.rotation.y = (1 - sm(7.6, 10.8, t)) * Math.sin(T * .55) * .75;
      G.rotation.x = (1 - sm(7.6, 10.8, t)) * Math.sin(T * .37) * .12;
      const zoom = 1 + sm(11.7, 12.4, t) * 1.8 + hit(t, 1.0, 6) * .05 + hit(t, 4.0, 6) * .06;
      G.scale.setScalar(zoom);
    }
    rings.forEach(({ m, spin }, i) => { m.rotation.z += spin * .016; m.material.opacity = sm(1.0 + i * .25, 2.2 + i * .25, t) * (i === 1 ? .25 : .45) * (1 - sm(11.9, 12.3, t)) + hit(t, 4.0) * .3; });
    ticks.material.opacity = sm(4.0, 5.0, t) * .5 * (1 - sm(11.9, 12.3, t)); ticks.rotation.z -= .0015;
    bg.material.opacity = sm(0, 2, t) * .55; bg.rotation.y = T * .02;
    // charging arc through the silence
    const ch = sm(8.2, 11.6, t); charge.geometry.dispose(); charge.geometry = new THREE.RingGeometry(25.5, 25.85, 160, 1, Math.PI / 2, -Math.max(.001, ch) * Math.PI * 2);
    charge.material.opacity = ch > 0 ? .8 * (1 - sm(11.9, 12.2, t)) : 0;
    // shockwaves on the hits
    [[1.0, 0], [4.0, 1], [12.0, 2]].forEach(([at, i]) => { const w = waves[i], x = t - at; if (x >= 0 && x < 1.6) { const s = 1 + x * (i === 2 ? 9 : 4.5); w.scale.setScalar(s); w.material.opacity = (1 - x / 1.6) * (i === 2 ? .9 : .6); } else w.material.opacity = 0; });
    // HUD text
    LINES.forEach(([at, txt], i) => { const on = running && t >= at; const e = lineEls[i]; if (on) { const s = typeof txt === 'function' ? txt() : txt; const n = Math.min(s.length, Math.floor((t - at) * 60)); e.textContent = s.slice(0, n) + (n < s.length ? '▌' : ''); e.classList.add('on'); } });
    title.classList.toggle('on', running && t > 8.9);
    const lf = loadFrac(); bar.style.width = (lf * 100).toFixed(1) + '%'; pct.textContent = 'LOADING ' + Math.round(lf * 100) + '%';
    if (running && t >= revealAt && lf >= 1) finish();
    else if (running && t >= revealAt) pct.textContent = 'FINALIZING ' + Math.round(lf * 100) + '%';
    R.render(S, C);
    requestAnimationFrame(frame);
  }
  function start() {
    if (running) return; running = true; root.classList.add('run'); gate.hidden = true; skip.hidden = false;
    usingAudio = SFX.soundOn && SFX.playIntro();
    t0 = performance.now();
  }
  function finish() {
    if (done) return; done = true; api.active = false;
    root.classList.add('out'); SFX.introDone(); document.dispatchEvent(new Event('introdone'));
    setTimeout(() => { root.remove(); R.dispose(); }, 1100);
  }
  gate.addEventListener('click', start);
  skip.addEventListener('click', () => { revealAt = 0; if (usingAudio) SFX.skipTo(12); if (loadFrac() >= 1) finish(); });
  // with sound off there is nothing to unlock, so play the sequence straight away
  if (!SFX.soundOn) setTimeout(start, 200);
  requestAnimationFrame(frame);
  return api;
})();

/* ---- offline: cache the app so it opens without internet ---- */
const APP_VERSION = 'v11'; document.getElementById('ver').textContent = '· ' + APP_VERSION;
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // pick up new versions on their own: check when the app comes back into focus, reload once a new version takes over
  const hadSW = !!navigator.serviceWorker.controller; let reloading = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloading) { reloading = true; location.reload(); } });
}
/* ---- boot ---- */
renderTimeline();
setInterval(renderTimeline, 60 * 60 * 1000);
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (CARDS.includes(id) && id !== current) select(id); });
select(location.hash.slice(1) || 'suit', true);
startSync();
</script>
